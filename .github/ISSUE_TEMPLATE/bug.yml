name: Bug report
description: 报告一个 Bug，帮助改进 XMOJ Electron
title: "[Bug] 请描述你遇到的问题"
labels: ["bug"]
type: "Bug"
assignees: ["zsTree0830"]

body:
- type: markdown
  attributes:
    value: "很高兴你能来！请填写下面的表单，帮助我们修复 XMOJ Electron 的问题："
- type: checkboxes
  id: confirm
  attributes:
    label: 提交前确认
    options:
    - label: 我已确认自己使用的是最新版本的 XMOJ Electron。
      required: true
    - label: 这个问题在最新版本中依然存在。
      required: true
    - label: 我已搜索过 [Issues](https://github.com/XMOJ-Script-dev/XMOJ-Electron/issues)，确认没有人反馈过同样的问题。
      required: true
    - label: 我愿意参与修复这个问题。
      required: false
- type: input
  id: app_version
  attributes:
    label: XMOJ Electron 版本
    description: "可以在侧边栏底部抽屉的「关于」里看到，或者看安装包文件名。"
    placeholder: "0.0.1"
  validations:
    required: true
- type: dropdown
  id: os
  attributes:
    label: 操作系统
    description: "你用的是哪个系统？"
    options:
      - Windows 11
      - Windows 10
      - Windows 8.1 / 8 / 7
      - macOS
      - Linux
      - Other (please specify name and version in the field below)
  validations:
    required: true
- type: input
  id: os_version
  attributes:
    label: 操作系统版本
    description: "请填写准确的版本号。"
    placeholder: "Windows 11 24H2 / macOS 15.2 / Ubuntu 24.04"
  validations:
    required: true
- type: dropdown
  id: install_type
  attributes:
    label: 安装方式
    description: "你是怎么得到这个应用的？"
    options:
      - 从 Releases 下载的安装包（Setup.exe / dmg / AppImage）
      - 自己从源码构建
      - 其他（请在下面说明）
  validations:
    required: true
- type: input
  id: judge_site
  attributes:
    label: 判题站地址
    description: "你连接的是哪个站点？自定义域名或自建站点请写清楚。"
    placeholder: "https://www.xmoj.tech"
  validations:
    required: false
- type: textarea
  id: problem
  attributes:
    label: Bug 描述
    description: "写明实际发生了什么。截图能更清楚地说明问题。"
    placeholder: "描述你遇到的 Bug"
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 期望行为
    description: "你原本期望发生什么？"
    placeholder: "点击按钮后应该能看到……"
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 复现步骤
    description: "请提供一步步的复现方法，越具体越好。"
    placeholder: "1. 打开……\n2. 点击……\n3. 出现……"
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: 日志或报错信息
    description: "按 `Ctrl + Shift + I` 打开开发者工具，把 Console 里的报错贴在这里。没有报错可以留空。"
    placeholder: "把 Console 的报错信息粘贴到这里"
    render: shell
  validations:
    required: false
