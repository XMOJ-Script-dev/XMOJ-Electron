name: Bug Report
description: 报告部分功能的问题
title: "[Bug] "
labels: ["bug"]
type: "Bug"
assignees: ["zsTree0830"]

body:
- type: markdown
  attributes:
    value: "我们很高兴您来到这里！请填写以下表单以报告 XMOJ Electron 的问题："
- type: checkboxes
  id: confirm
  attributes:
    label: 检查单
    options:
    - label: 我已确认自己使用的是最新版本的 XMOJ Electron。
      required: true
    - label: 这个问题在最新版本中依然存在。
      required: true
    - label: 我已搜索过 [Issues](https://github.com/XMOJ-Script-dev/XMOJ-Electron/issues) 且确认了这个 Bug 没有被提出过。
      required: true
- type: input
  id: os
  attributes:
    label: 操作系统
    description: "包括系统名称和版本。"
    placeholder: "Windows 11 26H2 / macOS 14.5 / Ubuntu 22.04"
  validations:
    required: true
- type: dropdown
  id: install_type
  attributes:
    label: 安装方式
    description: "安装 XMOJ Electron 的方式。"
    options:
      - Releases 或官网下载安装包安装
      - 源码构建
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Bug 描述
    description: "详细描述你遇到的 Bug。"
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 复现步骤
    description: "详细描述再次触发这个 Bug 的步骤。"
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: 日志或报错信息
    description: "按 <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>I</kbd> 打开开发者工具，把控制台里的报错贴在这里。没有报错可以留空。"
  validations:
    required: false
