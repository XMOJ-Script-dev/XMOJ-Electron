name: Feature Request
description: 提出新功能
title: "[Feature] "
labels: ["enhancement"]
type: "Feature"
assignees: ["zsTree0830"]

body:
- type: markdown
  attributes:
    value: "我们很高兴您来到这里！请填写以下表单为 XMOJ Electron 提出新功能建议："
- type: checkboxes
  id: confirm
  attributes:
    label: 提交前确认
    options:
    - label: 我已确认自己使用的是最新版本的 XMOJ Electron。
      required: true
    - label: 这个功能在最新版本中还不存在。
      required: true
    - label: 我已搜索过 [Issues](https://github.com/XMOJ-Script-dev/XMOJ-Electron/issues) 且确认了这个功能没有被提出过。
      required: true
- type: textarea
  id: description
  attributes:
    label: 功能描述
    description: "详细描述您想要的新功能。"
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: 原因
    description: "解释您为什么需要这个功能。"
  validations:
    required: false
