name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    outputs:
      tag: ${{ steps.parse-version.outputs.tag }}
      version: ${{ steps.parse-version.outputs.version }}
      prerelease: ${{ steps.parse-version.outputs.prerelease }}
      publish: ${{ steps.parse-version.outputs.publish }}

    steps:
      - name: Parse version
        id: parse-version
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.tag }}"

          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="$REF"; PUBLISH=true
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"; PUBLISH=true
            git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 \
            || { echo "::error::tag 不存在: $TAG"; exit 1; }
          else
            TAG="$REF"; PUBLISH=false
          fi

          VERSION="${TAG#v}"

          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            PRE=false
          else
            echo "::error::无法识别的版本号: $VERSION"; exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION prerelease=$PRE publish=$PUBLISH"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse-version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Electron App
        run: pnpm electron-builder
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ steps.parse-version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  create-release:
    needs: release
    if: ${{ needs.release.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: Release ${{ needs.release.outputs.tag }}
          prerelease: ${{ needs.release.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
