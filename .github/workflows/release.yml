name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Parse version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]] || [[ "${VERSION##*.}" == "0" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installers
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List built artifacts
        shell: bash
        run: ls -R "release/${{ steps.version.outputs.version }}" || true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "XMOJ Electron ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release/${{ steps.version.outputs.version }}/*.exe
            release/${{ steps.version.outputs.version }}/*.dmg
            release/${{ steps.version.outputs.version }}/*.AppImage
            release/${{ steps.version.outputs.version }}/*.zip
            release/${{ steps.version.outputs.version }}/latest*.yml
            release/${{ steps.version.outputs.version }}/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
