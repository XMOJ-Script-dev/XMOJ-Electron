name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    outputs:
      tag: ${{ steps.parse-version.outputs.tag }}
      version: ${{ steps.parse-version.outputs.version }}
      prerelease: ${{ steps.parse-version.outputs.prerelease }}
      publish: ${{ steps.parse-version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version
        id: parse-version
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.tag }}"
          APP_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="$REF"; PUBLISH=true
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"; PUBLISH=true
            git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 \
              || { echo "::error::tag 不存在: $TAG"; exit 1; }
          else
            TAG="$REF"; PUBLISH=false
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$APP_VERSION" ]]; then
              echo "::error::tag 是 $TAG，但 package.json 的版本是 $APP_VERSION；electron-builder 会输出到 release/$APP_VERSION，先 npm version $VERSION 再打 tag"
              exit 1
            fi
          else
            VERSION="$APP_VERSION"
          fi

          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            PATCH="${BASH_REMATCH[3]}"
            if [[ "$PATCH" == "0" ]]; then PRE=false; else PRE=true; fi
          else
            echo "::error::无法识别的版本号: $VERSION"; exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION prerelease=$PRE publish=$PUBLISH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npx vite build

      - name: Build installers
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --publish never

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          DIR="release/${{ steps.parse-version.outputs.version }}"
          test -d "$DIR" || { echo "::error::产物目录不存在: $DIR"; exit 1; }
          ls -l "$DIR"
          case "${{ matrix.platform }}" in
            win)   compgen -G "$DIR/*.exe" > /dev/null || { echo "::error::缺少 exe"; exit 1; } ;;
            mac)   compgen -G "$DIR/*.dmg" > /dev/null || { echo "::error::缺少 dmg"; exit 1; } ;;
            linux) compgen -G "$DIR/*.AppImage" > /dev/null || { echo "::error::缺少 AppImage"; exit 1; } ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/${{ steps.parse-version.outputs.version }}/*.exe
            release/${{ steps.parse-version.outputs.version }}/*.dmg
            release/${{ steps.parse-version.outputs.version }}/*.AppImage
            release/${{ steps.parse-version.outputs.version }}/*.deb
            release/${{ steps.parse-version.outputs.version }}/*.blockmap
            release/${{ steps.parse-version.outputs.version }}/latest*.yml

  create-release:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Show assets
        run: ls -lR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
