name: Sync

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dev-to-extern-contrib:
    runs-on: ubuntu-latest
    name: Sync dev → extern-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push dev → extern-contrib
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git push origin HEAD:refs/heads/extern-contrib
