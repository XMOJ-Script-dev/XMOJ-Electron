name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    timeout-minutes: 180
    if: |
      (
        (github.event_name == 'issue_comment' && 
         contains(github.event.comment.body, '@claude') &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER')
        ) ||
        (github.event_name == 'pull_request_review_comment' && 
         contains(github.event.comment.body, '@claude') &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER')
        ) ||
        (github.event_name == 'pull_request_review' && 
         contains(github.event.review.body, '@claude') &&
         (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'COLLABORATOR' || github.event.review.author_association == 'MEMBER')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the API key is configured
        id: config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret DEEPSEEK_API_KEY is not set, so @claude is skipped."
          fi

      - name: Run Claude Code
        id: claude
        if: steps.config.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
        with:
          allowed_bots: '*'
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: |
            The user mentioned @claude in a comment on PR #${{ github.event.issue.number || github.event.pull_request.number }}.
            Their comment was: "${{ github.event.comment.body || github.event.review.body }}"

            **Step 1 - Read the full comment carefully.**
            Identify what the user specifically wants you to fix or review. If the request is vague (e.g., just "修一下" or "fix"), you must proactively find improvements based on the PR diff.

            **Step 2 - ALWAYS start by running `gh pr diff`.**
            This shows you exactly which files and lines were changed in this PR. You are ONLY allowed to touch those files. Never review, comment on, or modify any file that is not present in the diff.

            **Step 3 - Choose mode and execute within the diff scope.**
            - **FIX MODE** (comment contains "fix", "修复", "修", "改", "solve", "correct", or similar repair intent):
              - If a specific problem is described, fix that problem inside the PR diff.
              - If the request is general, proactively improve the code quality, performance, or readability of the changed files.
              - You MUST edit at least one file from the diff, commit with a clear message, and push.
              - Do NOT just review and say "LGTM". Always make a meaningful change.
            - **REVIEW MODE** (comment only asks for "review"/"审查" without repair intent):
              - Only add inline comments to the diff files. Do not modify any code.
            - For other questions, reply in Simplified Chinese in the PR thread.

            **Critical rules for this repository (repeat and obey):**
            - This is an Electron + Vue 3 + TypeScript desktop client for xmoj.tech. Never write comments in the source, not even JSDoc; the entire project is comment-free and the reasoning lives in README.md.
            - Never re-introduce a `<webview>`, `window.open`, `target="_blank"` or a system-browser hand-off. Every judge page is implemented natively in the app.
            - A non-zero exit from `npm run typecheck`, `npm run build`, or any test suite is a real failure. Fix it instead of working around it.

            **Critical rule (repeated):** Your entire analysis must stay inside the files shown by `gh pr diff`. Ignore everything else.
          claude_args: |
            --model ${{ vars.DEEPSEEK_MODEL }} --effort ${{ vars.DEEPSEEK_EFFORT }} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit,Read,Grep,Glob,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(npm run typecheck:*),Bash(npm run build:*),Bash(npm test:*)"
