name: Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  anonymous:
    name: Suites without credentials
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Run suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $suites = @(
            'test',
            'test:poller',
            'test:codecheck',
            'test:diff',
            'test:cache',
            'test:async-resource',
            'test:native-views',
            'test:cloud-settings',
            'test:markdown',
            'test:smoke'
          )
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "::group::$suite"
            npm run $suite
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed suites: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All credential-free suites passed."

  credentialed:
    name: Suites that need an account
    runs-on: windows-latest
    timeout-minutes: 60
    needs: anonymous
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      XMOJ_ACCOUNT: ${{ secrets.XMOJ_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Report missing credentials
        if: env.XMOJ_ACCOUNT == ''
        run: echo "::notice::Secret XMOJ_ACCOUNT is not set, skipping the suites that require a login."

      - name: Write test account
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          $content = $env:XMOJ_ACCOUNT -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'tests/account.txt'),
            $content,
            (New-Object System.Text.UTF8Encoding $false)
          )

      - name: Validate test account
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          $lines = Get-Content 'tests/account.txt' -ErrorAction Stop
          $hasUser = @($lines | Where-Object { $_ -match '^\s*Username\s*[:=]\s*\S' }).Count -gt 0
          $hasPass = @($lines | Where-Object { $_ -match '^\s*Password\s*[:=]\s*\S' }).Count -gt 0
          Write-Host "account.txt lines: $($lines.Count)"
          Write-Host "has Username: $hasUser"
          Write-Host "has Password: $hasPass"
          if (-not ($hasUser -and $hasPass)) {
            Write-Host "::error title=XMOJ_ACCOUNT format::Secret XMOJ_ACCOUNT must contain two lines: 'Username: <user>' and 'Password: <pass>'"
            exit 1
          }

      - name: Install Electron binary
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/electron/dist')) {
            npx install-electron
            if ($LASTEXITCODE -ne 0) { throw 'install-electron failed' }
          }

      - name: Run suites
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $ErrorActionPreference = 'Continue'
          $suites = @(
            'test:live',
            'test:live-community',
            'test:live-sources',
            'test:live-judge-api',
            'test:compare',
            'test:e2e'
          )
          $logDir = Join-Path $PWD 'test-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $results = @()
          foreach ($suite in $suites) {
            $safe = $suite -replace '[^A-Za-z0-9_.-]', '_'
            $log = Join-Path $logDir "$safe.log"
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            Write-Host "::group::$suite"
            npm run $suite *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $watch.Stop()
            Write-Host "::endgroup::"
            $seconds = [math]::Round($watch.Elapsed.TotalSeconds, 1)
            Write-Host "$suite -> exit=$code  ${seconds}s"
            if ($code -ne 0) {
              Write-Host "::error title=$suite failed::$suite exited with $code after ${seconds}s (see the test-logs artifact)"
            }
            $results += [pscustomobject]@{ Suite = $suite; Exit = $code; Seconds = $seconds }
          }

          $results | Format-Table -AutoSize | Out-String | Write-Host
          $summary = @('| Suite | Exit | Seconds |', '| --- | --- | --- |')
          foreach ($r in $results) {
            $icon = if ($r.Exit -eq 0) { 'pass' } else { 'FAIL' }
            $summary += "| ``$($r.Suite)`` | $icon | $($r.Seconds) |"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $failed = @($results | Where-Object { $_.Exit -ne 0 })
          if ($failed.Count -gt 0) {
            Write-Host "::error title=Failed suites::$($failed.Suite -join ', ')"
            exit 1
          }
          Write-Host "All credentialed suites passed."

      - name: Remove test account
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path tests/account.txt -Force -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always() && env.XMOJ_ACCOUNT != ''
        uses: actions/upload-artifact@v4
        with:
          name: credentialed-logs
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-logs/
            tests/.electron-stdout.txt
            tests/.electron-stderr.txt
            tests/live-login-report.txt
