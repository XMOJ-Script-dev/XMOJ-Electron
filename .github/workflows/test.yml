name: Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  anonymous:
    name: Suites without credentials
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Run suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $suites = @(
            'test',
            'test:poller',
            'test:codecheck',
            'test:diff',
            'test:cache',
            'test:native-views',
            'test:cloud-settings',
            'test:markdown',
            'test:smoke'
          )
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "::group::$suite"
            npm run $suite
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed suites: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All credential-free suites passed."

  credentialed:
    name: Suites that need an account
    runs-on: windows-latest
    timeout-minutes: 60
    needs: anonymous
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      XMOJ_ACCOUNT: ${{ secrets.XMOJ_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Report missing credentials
        if: env.XMOJ_ACCOUNT == ''
        run: echo "::notice::Secret XMOJ_ACCOUNT is not set, skipping the suites that require a login."

      - name: Write test account
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          $content = $env:XMOJ_ACCOUNT -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'tests/account.txt'),
            $content,
            (New-Object System.Text.UTF8Encoding $false)
          )

      - name: Install Electron binary
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/electron/dist')) {
            npx install-electron
            if ($LASTEXITCODE -ne 0) { throw 'install-electron failed' }
          }

      - name: Run suites
        if: env.XMOJ_ACCOUNT != ''
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: ''
        run: |
          $ErrorActionPreference = 'Continue'
          $suites = @(
            'test:live',
            'test:live-community',
            'test:live-sources',
            'test:live-judge-api',
            'test:compare',
            'test:e2e'
          )
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "::group::$suite"
            npm run $suite
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed suites: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All credentialed suites passed."

      - name: Remove test account
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path tests/account.txt -Force -ErrorAction SilentlyContinue

      - name: Upload e2e logs
        if: always() && env.XMOJ_ACCOUNT != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tests/.electron-stdout.txt
            tests/.electron-stderr.txt
            tests/live-login-report.txt
